# AgroStake GUI Configuration File
# Customize behavior without editing source code

[SERIAL]
# Default baud rate for ESP32 communication
BAUD_RATE = 115200

# Timeout for serial read operations (seconds)
SERIAL_TIMEOUT = 5

# Reset hold time for DTR pulse (seconds)
RESET_HOLD_TIME = 0.1

# Boot wait time after reset (seconds)
BOOT_WAIT_TIME = 2.0

# Result read timeout (seconds)
RESULT_TIMEOUT = 10.0

[IMAGE]
# Target image dimensions
IMAGE_WIDTH = 96
IMAGE_HEIGHT = 96
IMAGE_CHANNELS = 3

# Supported image formats
SUPPORTED_FORMATS = png,jpg,jpeg,bmp

# Quantization range for INT8
QUANT_MIN = -128
QUANT_MAX = 127

[CLASSES]
# Class mapping (matches alphabetical folder order in dataset)
# Index: ClassName
0 = Black_rot
1 = Esca
2 = Healthy
3 = Leaf_blight

[UI]
# Preview area size (pixels)
PREVIEW_WIDTH = 400
PREVIEW_HEIGHT = 300

# Application window size
WINDOW_WIDTH = 1200
WINDOW_HEIGHT = 800

# Font configuration
CONSOLE_FONT = Courier New
CONSOLE_FONT_SIZE = 9
BUTTON_FONT = Arial
BUTTON_FONT_SIZE = 11

# Theme style (Fusion recommended for cross-platform)
THEME_STYLE = Fusion

# Dark theme colors (hex)
COLOR_BG_DARK = #191919
COLOR_BG_LIGHT = #323232
COLOR_TEXT = #c0c0c0
COLOR_ACCENT = #0d47a1
COLOR_SUCCESS = #00ff00
COLOR_ERROR = #ff5555
COLOR_WARNING = #ffaa00

[LOGGING]
# Console output verbosity (DEBUG, INFO, WARNING, ERROR)
LOG_LEVEL = INFO

# Enable timestamp in console output
LOG_TIMESTAMPS = true

# Maximum console output lines before clearing
MAX_CONSOLE_LINES = 10000

[PROTOCOL]
# Magic byte for handshake
MAGIC_BYTE = 0xAA

# Image data size (96*96*3)
IMAGE_DATA_SIZE = 27648

# Expected response keywords
RESPONSE_KEYWORDS = CLASS,SCORE,CONF,TIME

[DEV]
# Enable debug mode (more verbose logging)
DEBUG_MODE = false

# Show raw serial data in console
SHOW_RAW_SERIAL = false

# Simulate inference without serial connection
SIMULATION_MODE = false
